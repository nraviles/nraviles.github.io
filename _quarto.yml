project:
  type: website
  output-dir: _site

website:
  title: "The Tilted Windmill"
  site-url: "https://nraviles.github.io/"
  description: "A blog dedicated to mathematics notes and articles."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: notes.qmd
        text: Notes & Blog
      - href: about.qmd
        text: About

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    toc-location: left
    reference-location: margin
    html-math-method: mathjax
    include-before-body: macros.html
    
bibliography: references.bib